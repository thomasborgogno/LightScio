# Push a tag like v1.0.0 to build the Windows installer and the macOS disk image
# and publish them as a GitHub release. The version number comes from the tag.
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Version from tag
        shell: bash
        run: echo "LIGHTSCIO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: ./installer/windows/build-installer.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: target/installer/*.exe
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Version from tag
        run: echo "LIGHTSCIO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build disk image
        run: bash installer/macos/build-dmg.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: target/installer/*.dmg
          generate_release_notes: true
