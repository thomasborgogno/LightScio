[package]
name = "lightscio"
version = "0.1.0"
edition = "2021"
description = "Light show da tracce multitraccia, con anteprima, export MIDI e uscita DMX live"
license = "MIT"
readme = "README.md"

[[bin]]
name = "lightscio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", features = ["persistence"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis"] }
rustfft = "6"
cpal = "0.15"
midir = "0.10"
serialport = { version = "4", default-features = false }
rfd = "0.15"
roxmltree = "0.20"
sys-locale = "0.3"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# macOS only: start the screenshot check without stealing focus
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[dev-dependencies]
# only for examples/make_icons.rs (builds the icons from one picture)
image = { version = "0.25", default-features = false, features = ["png", "webp", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
